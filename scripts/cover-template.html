<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Book Cover Template</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1600px;
    height: 2400px;
    overflow: hidden;
    font-family: "Noto Serif TC", "Source Han Serif TC", "PMingLiU", serif;
    color: #fff;
    position: relative;
  }

  /* Background image - covers entire canvas */
  .bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* Dark gradient overlays for text readability */
  .overlay-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.7) 0%,
      rgba(0,0,0,0.4) 60%,
      transparent 100%
    );
  }

  .overlay-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    background: linear-gradient(
      to top,
      rgba(0,0,0,0.75) 0%,
      rgba(0,0,0,0.4) 50%,
      transparent 100%
    );
  }

  /* Text layers */
  .text-top {
    position: absolute;
    top: 8%;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }

  .title-zh {
    font-size: 180px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-shadow: 0 6px 30px rgba(0,0,0,0.85), 0 3px 10px rgba(0,0,0,0.6);
    line-height: 1.15;
    margin-bottom: 24px;
  }

  .title-en {
    font-family: "Georgia", "Noto Serif TC", serif;
    font-size: 56px;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 3px 16px rgba(0,0,0,0.7);
    margin-bottom: 36px;
  }

  .subtitle {
    font-size: 48px;
    font-weight: 400;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 3px 14px rgba(0,0,0,0.65);
    margin-top: 12px;
  }

  .text-bottom {
    position: absolute;
    bottom: 6%;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
  }

  .author {
    font-size: 52px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-shadow: 0 3px 14px rgba(0,0,0,0.75);
    margin-bottom: 10px;
  }

  .author-en {
    font-family: "Georgia", "Noto Serif TC", serif;
    font-size: 36px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.75);
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }

  /* Decorative divider */
  .divider {
    width: 80px;
    height: 1px;
    background: rgba(255,255,255,0.4);
    margin: 24px auto;
  }
</style>
</head>
<body>
  <!-- REPLACE: background image path -->
  <div class="bg" style="background-image: url('BG_IMAGE_URL');"></div>
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  <div class="text-top">
    <div class="title-zh">TITLE_ZH</div>
    <div class="title-en">TITLE_EN</div>
    <div class="divider"></div>
    <div class="subtitle">SUBTITLE</div>
  </div>

  <div class="text-bottom">
    <div class="author">林雨果</div>
    <div class="author-en">Hugo Lin</div>
  </div>
</body>
</html>
